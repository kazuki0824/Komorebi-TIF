name: PR3 Robolectric Regression

on:
  pull_request:
    paths:
      - '.github/workflows/pr3-robolectric-regression.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  push:
    branches:
      - test/pr3-robolectric-regression
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  robolectric:
    name: Android JVM regression (Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enforce test-only PR scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/fix/tif-pr1-d-stack:refs/remotes/origin/fix/tif-pr1-d-stack
          git diff --name-only origin/fix/tif-pr1-d-stack HEAD > /tmp/pr3-regression-changed.txt
          test -s /tmp/pr3-regression-changed.txt
          while IFS= read -r path; do
            case "$path" in
              app/src/test/*|app/build.gradle.kts|.github/workflows/*) ;;
              *) echo "FAIL: disallowed production-file change: $path"; exit 1 ;;
            esac
          done < /tmp/pr3-regression-changed.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || test "${PIPESTATUS[1]:-0}" -eq 0
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.30.5"
          test -d "${ANDROID_HOME}/platforms/android-35"

      - name: Run Robolectric regressions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.beeregg2001.komorebi.regression.*' \
            --stacktrace

      - name: Verify complete regression suite executed
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          if not paths:
              raise SystemExit("FAIL: no JUnit XML results produced")
          cases = []
          failures = 0
          skipped = 0
          for path in paths:
              root = ET.parse(path).getroot()
              cases.extend(root.findall(".//testcase"))
              failures += sum(1 for case in root.findall(".//testcase") if case.find("failure") is not None or case.find("error") is not None)
              skipped += sum(1 for case in root.findall(".//testcase") if case.find("skipped") is not None)
          from collections import Counter
          actual = Counter(case.attrib.get("classname", "").rsplit(".", 1)[-1] for case in cases)
          expected = {
              "BackendDataIsolationRegressionTest": 8,
              "ChannelViewModelRegressionTest": 4,
              "DatabaseMigrationRegressionTest": 1,
              "DtvProviderProxyRoutingRegressionTest": 7,
              "SettingsBackendFailureRegressionTest": 2,
              "EpgInFlightBackendRegressionTest": 2,
              "EpgSearchBackendRegressionTest": 7,
              "EpgStateRegressionTest": 2,
              "EpgViewModelGenerationRegressionTest": 4,
              "ExistingHomeNavigationRegressionTest": 4,
              "LastChannelRegressionTest": 5,
              "RecordCacheOwnershipRegressionTest": 5,
              "RecordSyncBackendTransitionRegressionTest": 7,
              "RecordViewModelRegressionTest": 5,
              "WatchHistoryRepositoryRegressionTest": 4,
              "VideoPlaybackHistoryOwnershipRegressionTest": 2,
          }
          print(f"PR3 regression cases: {len(cases)}; failed: {failures}; skipped: {skipped}")
          print(f"Test class coverage: {dict(actual)}")
          if actual != Counter(expected) or failures or skipped:
              raise SystemExit(f"FAIL: expected class coverage {expected}, got {dict(actual)}; failed={failures}; skipped={skipped}")
          PY

      - name: Upload JVM test evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr3-robolectric-junit
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
